# Planet sprite LBX mappings per planet class and size variant.
# Each planet class has five size variants: tiny, small, medium, large, huge.
# The special class "gas_giant" (uninhabitable) only uses the huge variant.
# All planet animations loop continuously — there is no twinkle scheduler.
#
# A zero/missing LBX value means "no sprite configured"; the renderer falls back
# to a coloured circle.
planet_sprites:
  - class: terran
    sizes:
      tiny:   { lbx: BUFFER0.LBX, record: 132 }
      small:  { lbx: BUFFER0.LBX, record: 133 }
      medium: { lbx: BUFFER0.LBX, record: 134 }
      large:  { lbx: BUFFER0.LBX, record: 135 }
      huge:   { lbx: BUFFER0.LBX, record: 136 }

  - class: tundra
