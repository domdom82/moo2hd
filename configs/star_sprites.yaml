# Star sprite LBX mappings per star type and zoom level.
# Each zoom level names the LBX archive and zero-based record index of the sprite
# to render at that level of detail.
#
# Zoom levels:
#   system — closest view (ZoomSystem / ZoomClose), large star art
#   close  — ZoomClose, mid-sized art
#   mid    — ZoomMid, small art
#   far    — ZoomFar, tiny dot art
star_sprites:
  - star: orange
    system: { lbx: BUFFER0.LBX, record: 160 }
    close:  { lbx: BUFFER0.LBX, record: 161 }
    mid:    { lbx: BUFFER0.LBX, record: 161, scale: 2.0 }
    far:    { lbx: BUFFER0.LBX, record: 160, scale: 2.5 }
  - star: blue
    system: { lbx: BUFFER0.LBX, record: 148 }
    close:  { lbx: BUFFER0.LBX, record: 149 }
    mid:    { lbx: BUFFER0.LBX, record: 149, scale: 2.0 }
    far:    { lbx: BUFFER0.LBX, record: 148, scale: 2.5 }
  - star: white
    system: { lbx: BUFFER0.LBX, record: 154 }
    close:  { lbx: BUFFER0.LBX, record: 155 }
    mid:    { lbx: BUFFER0.LBX, record: 155, scale: 2.0 }
    far:    { lbx: BUFFER0.LBX, record: 154, scale: 2.5 }
  - star: yellow
    system: { lbx: BUFFER0.LBX, record: 178 }
    close:  { lbx: BUFFER0.LBX, record: 179 }
    mid:    { lbx: BUFFER0.LBX, record: 179, scale: 2.0 }
    far:    { lbx: BUFFER0.LBX, record: 178, scale: 2.5 }
  - star: brown
    system: { lbx: BUFFER0.LBX, record: 166 }
    close:  { lbx: BUFFER0.LBX, record: 167 }
    mid:    { lbx: BUFFER0.LBX, record: 167, scale: 2.0 }
    far:    { lbx: BUFFER0.LBX, record: 166, scale: 2.5 }
  - star: red
    system: { lbx: BUFFER0.LBX, record: 172 }
    close:  { lbx: BUFFER0.LBX, record: 173 }
    mid:    { lbx: BUFFER0.LBX, record: 173, scale: 2.0 }
    far:    { lbx: BUFFER0.LBX, record: 172, scale: 2.5 }
  - star: black_hole
    system: { lbx: BUFFER0.LBX, record: 184 }
    close:  { lbx: BUFFER0.LBX, record: 185 }
    mid:    { lbx: BUFFER0.LBX, record: 185, scale: 2.0 }
    far:    { lbx: BUFFER0.LBX, record: 184, scale: 2.5 }

# Star animation timing per galaxy size.
# anim_type: "random" — sporadic twinkle batches; options in random_opt.
#            "loop"   — every star animates continuously; no extra options.
star_anim:
  - galaxy_size: small
    anim_type: random
    random_opt:
      count_min: 1
      count_max: 2
      interval_min_s: 90
      interval_max_s: 240
  - galaxy_size: medium
    anim_type: random
    random_opt:
      count_min: 1
      count_max: 2
      interval_min_s: 60
      interval_max_s: 180
  - galaxy_size: large
    anim_type: random
    random_opt:
      count_min: 1
      count_max: 2
      interval_min_s: 60
      interval_max_s: 180
  - galaxy_size: cluster
    anim_type: random
    random_opt:
      count_min: 2
      count_max: 3
      interval_min_s: 45
      interval_max_s: 120
  - galaxy_size: huge
    anim_type: loop
