ships:
  # Hull stats based on original MOO2 game data.
  # space:        internal equipment space in tons.
  # hp:           internal systems hit points (destroyed when all internals are hit).
  # structure:    structural hit points — must be reduced to 0 before internals take
  #               damage. Scales with armor technology level.
  # armor_class:  base armor rating; each armor tech level multiplies this and adds an
  #               additional ablative armor layer on top of structure.
  # shield_class: base shield class (1=Class I, 3=Class III, 5=Class V, etc.).
  #               Shields regenerate each combat round and absorb damage before
  #               structure is hit. 0 means no shields installed by default.
  # speed:        base combat speed before engine technology bonuses.
  # cost:         base production cost in BC; reduced by industrial techs.
  # weapon_slots: number of weapon mount hardpoints.
  # special_slots: number of special equipment slots.

  - id: scout
    name: Scout
    hull: frigate
    space: 40
    hp: 3
    structure: 10
    armor_class: 0
    shield_class: 0
    speed: 3
    cost: 20
    weapon_slots: 1
    special_slots: 1

